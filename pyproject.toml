[project]
name = "sigma-research"
version = "0.1.4"
description = "Local-first research project lifecycle"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx==0.28.1",
    "pillow==13.0.0",
    "pyjwt[crypto]==2.10.1",
    "python-dotenv==1.2.1",
    "uvicorn>=0.30,<1",
]

[project.scripts]
sigma = "sigma.cli:main"

[dependency-groups]
dev = ["httpx>=0.27,<1", "ruff>=0.9", "pyright>=1.1.390"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sigma"]

[tool.ruff]
line-length = 100

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
