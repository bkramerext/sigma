name: T92 Recent Projects browser acceptance

on:
  pull_request:
    paths:
      - "frontend/**"
      - "src/sigma/recents.py"
      - "src/sigma/research_sessions.py"
      - "browser_checks/t92_recent_running.py"
      - ".github/workflows/t92-recents-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recents-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SIGMA_CLOUD_AUTH_ENABLED: "false"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies and browser
        run: |
          ./sigma setup
          uv run --with playwright python -m playwright install --with-deps chromium
      - name: Run real Chromium Recent Projects acceptance
        shell: bash
        run: |
          set -euo pipefail
          uv run uvicorn provider_fixture:app --app-dir browser_checks --host 127.0.0.1 --port 8001 > /tmp/t92-api.log 2>&1 &
          api_pid=$!
          npm --prefix frontend run dev -- --host 127.0.0.1 --port 5173 --strictPort > /tmp/t92-ui.log 2>&1 &
          ui_pid=$!
          trap 'kill "$api_pid" "$ui_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null && curl -fsS http://127.0.0.1:8001/openapi.json >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5173/ >/dev/null
          curl -fsS http://127.0.0.1:8001/openapi.json >/dev/null
          export SIGMA_BROWSER_EXECUTABLE="$(uv run --with playwright python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          uv run --with playwright python browser_checks/recents.py
