name: Browser verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sigma-browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Browser acceptance (${{ matrix.group }}/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        group: ['1', '2']
    env:
      CI: "true"
      SIGMA_CLOUD_AUTH_ENABLED: "false"
      SIGMA_T201_INFO: /tmp/sigma-t201-info.json
      SIGMA_OUTCOME_SCREENSHOT_DIR: /tmp/sigma-outcome-acceptance
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Runner-local uv caching remains available during the job. Disable
      # setup-uv's cross-run cache, whose post-job prune can block on a
      # surviving uvicorn fixture launched by "uv run".
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies once
        id: dependencies
        run: ./sigma setup
      # The hosted Ubuntu image supplies Chromium's shared-library dependencies.
      # Never install OS packages here: Playwright --with-deps invokes apt and
      # Ubuntu mirror DNS failures have blocked both browser test groups.
      # Bound downloads and prove that Chromium can actually launch before tests.
      - name: Prepare and smoke-test Chromium (no apt)
        id: chromium
        shell: bash
        timeout-minutes: 6
        run: |
          set -euo pipefail
          echo "::group::Chromium installation (max 240 seconds; no apt)"
          if timeout --signal=TERM --kill-after=10s 240s \
            uv run --with playwright python -m playwright install chromium \
            > /tmp/sigma-chromium-setup.log 2>&1; then
            cat /tmp/sigma-chromium-setup.log
          else
            result=$?
            cat /tmp/sigma-chromium-setup.log
            if [ "$result" -eq 124 ] || [ "$result" -eq 137 ]; then
              echo "::error title=Browser infrastructure timeout::Chromium download exceeded 240 seconds. SIGMA browser acceptance was not executed."
            else
              echo "::error title=Browser infrastructure failure::Chromium installation failed (exit $result). SIGMA browser acceptance was not executed."
            fi
            exit "$result"
          fi
          echo "::endgroup::"
          echo "::group::Headless Chromium launch smoke"
          if ! timeout --signal=TERM --kill-after=10s 60s uv run --with playwright \
            python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(headless=True); page=b.new_page(); page.goto("data:text/html,<title>SIGMA browser smoke</title>"); assert page.title()=="SIGMA browser smoke"; print("Chromium launch smoke passed:", b.version); b.close(); p.stop()' \
            > /tmp/sigma-chromium-smoke.log 2>&1; then
            cat /tmp/sigma-chromium-smoke.log
            echo "::error title=Browser infrastructure failure::Chromium could not launch on this runner. SIGMA browser acceptance was not executed."
            exit 1
          fi
          cat /tmp/sigma-chromium-smoke.log
          echo "::endgroup::"
      - name: Project diagnostics copy/download browser acceptance (#525)
        if: ${{ matrix.group == '1' && !cancelled() && steps.dependencies.outcome == 'success' && steps.chromium.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          export SIGMA_BROWSER_EXECUTABLE="$(uv run --with playwright python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          uv run --with playwright python browser_checks/issue525_project_diagnostics.py
      - name: Public Samples guest star and PDF acceptance
        # Independent suites should all run, even after another suite fails.
        if: ${{ matrix.group == '1' && !cancelled() && steps.dependencies.outcome == 'success' && steps.chromium.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          export SIGMA_BROWSER_EXECUTABLE="$(uv run --with playwright python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          uv run --with playwright python browser_checks/guest_samples.py
      - name: Research Outcome browser acceptance
        # Independent suites should all run, even after another suite fails.
        if: ${{ matrix.group == '1' && !cancelled() && steps.dependencies.outcome == 'success' && steps.chromium.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          export SIGMA_BROWSER_EXECUTABLE="$(uv run --with playwright python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          uv run --with playwright python browser_checks/t47_conclusion.py
      - name: Project Types browser acceptance
        # Independent suites should all run, even after another suite fails.
        if: ${{ matrix.group == '1' && !cancelled() && steps.dependencies.outcome == 'success' && steps.chromium.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          export SIGMA_PROJECTS_ROOT="$(mktemp -d)"
          uv run uvicorn provider_fixture:app --app-dir browser_checks --host 127.0.0.1 --port 8026 >/tmp/project-types-api.log 2>&1 &
          api_pid=$!
          npm --prefix frontend run dev -- --host 127.0.0.1 --port 5173 --strictPort >/tmp/project-types-ui.log 2>&1 &
          ui_pid=$!
          trap 'kill "$api_pid" "$ui_pid" 2>/dev/null || true; rm -rf "$SIGMA_PROJECTS_ROOT"' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null && curl -fsS http://127.0.0.1:8026/openapi.json >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8026/openapi.json >/dev/null
          export SIGMA_BROWSER_EXECUTABLE="$(uv run --with playwright python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          uv run --with playwright python browser_checks/project_types_436.py
          uv run --with playwright python browser_checks/project_email.py
          uv run --with playwright python browser_checks/collaboration_settings.py
          # Two separate authenticated local browser profiles, real project ACL
          # and revision endpoints (no mocked project or collaboration responses).
          uv run --with playwright python browser_checks/collaboration_local_accounts.py
      - name: Research Q/A browser acceptance
        # Validate the exact Q/A toolbar, scroll and source navigation in real Chrome.
        if: ${{ matrix.group == '2' && !cancelled() && steps.dependencies.outcome == 'success' && steps.chromium.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          # Other browser suites can leave port 5173 occupied briefly after teardown.
          # Isolate this app from their Vite instances and fail if ours never starts.
          SIGMA_PAPER_PROGRESS_FIXTURE_ORIGIN=http://127.0.0.1:5174 uv run uvicorn provider_fixture:app --app-dir browser_checks --host 127.0.0.1 --port 8012 >/tmp/research-qa-api.log 2>&1 &
          api_pid=$!
          SIGMA_API_TARGET=http://127.0.0.1:8012 npm --prefix frontend run dev -- --host 127.0.0.1 --port 5174 --strictPort >/tmp/research-qa-ui.log 2>&1 &
          ui_pid=$!
          trap 'kill "$api_pid" "$ui_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            kill -0 "$api_pid" && kill -0 "$ui_pid" || { cat /tmp/research-qa-api.log /tmp/research-qa-ui.log; exit 1; }
            if curl -fsS http://127.0.0.1:5174/ >/dev/null && curl -fsS http://127.0.0.1:5174/api/projects/samples >/dev/null && curl -fsS http://127.0.0.1:8012/openapi.json >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/research-qa-api.log /tmp/research-qa-ui.log; exit 1; fi
          export SIGMA_QA_UI=http://127.0.0.1:5174
          export SIGMA_BROWSER_EXECUTABLE="$(uv run --with playwright python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          uv run --with playwright python browser_checks/research_qa.py
      - name: Model availability browser acceptance
        # Independent suites should all run, even after another suite fails.
        if: ${{ matrix.group == '2' && !cancelled() && steps.dependencies.outcome == 'success' && steps.chromium.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          uv run uvicorn provider_fixture:app --app-dir browser_checks --host 127.0.0.1 --port 8001 >/tmp/t200-api.log 2>&1 &
          api_pid=$!
          npm --prefix frontend run dev -- --host 127.0.0.1 --port 5173 --strictPort >/tmp/t200-ui.log 2>&1 &
          ui_pid=$!
          trap 'kill "$api_pid" "$ui_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null && curl -fsS http://127.0.0.1:8001/openapi.json >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8001/openapi.json >/dev/null
          export SIGMA_BROWSER_EXECUTABLE="$(uv run --with playwright python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          uv run --with playwright python browser_checks/model_availability.py
      - name: Obligation recovery and public legal pages browser acceptance
        # Independent suites should all run, even after another suite fails.
        if: ${{ matrix.group == '2' && !cancelled() && steps.dependencies.outcome == 'success' && steps.chromium.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          uv run uvicorn browser_checks.t201_fixture:app --host 127.0.0.1 --port 8000 >/tmp/t201-api.log 2>&1 &
          api_pid=$!
          npm --prefix frontend run dev -- --port 5173 --strictPort >/tmp/t201-ui.log 2>&1 &
          ui_pid=$!
          trap 'kill "$api_pid" "$ui_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null && curl -fsS http://127.0.0.1:8000/openapi.json >/dev/null && test -s "$SIGMA_T201_INFO"; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/openapi.json >/dev/null
          export SIGMA_BROWSER_EXECUTABLE="$(uv run --with playwright python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          uv run --with playwright python browser_checks/t201_overflow.py
          uv run --with playwright python browser_checks/t81_public_legal_pages.py
      - name: Recent Projects browser acceptance
        # Independent suites should all run, even after another suite fails.
        if: ${{ matrix.group == '2' && !cancelled() && steps.dependencies.outcome == 'success' && steps.chromium.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          uv run uvicorn provider_fixture:app --app-dir browser_checks --host 127.0.0.1 --port 8001 >/tmp/t92-api.log 2>&1 &
          api_pid=$!
          npm --prefix frontend run dev -- --host 127.0.0.1 --port 5173 --strictPort >/tmp/t92-ui.log 2>&1 &
          ui_pid=$!
          trap 'kill "$api_pid" "$ui_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null && curl -fsS http://127.0.0.1:8001/openapi.json >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8001/openapi.json >/dev/null
          export SIGMA_BROWSER_EXECUTABLE="$(uv run --with playwright python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          uv run --with playwright python browser_checks/t92_recent_running.py
      - name: Save As browser acceptance
        if: ${{ matrix.group == '2' && !cancelled() && steps.dependencies.outcome == 'success' && steps.chromium.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          uv run uvicorn provider_fixture:app --app-dir browser_checks --host 127.0.0.1 --port 8001 >/tmp/save-as-api.log 2>&1 &
          api_pid=$!
          npm --prefix frontend run dev -- --host 127.0.0.1 --port 5173 --strictPort >/tmp/save-as-ui.log 2>&1 &
          ui_pid=$!
          trap 'kill "$api_pid" "$ui_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null && curl -fsS http://127.0.0.1:8001/openapi.json >/dev/null; then break; fi
            sleep 1
          done
          export SIGMA_BROWSER_BASE_URL=http://127.0.0.1:5173
          export SIGMA_BROWSER_EXECUTABLE="$(uv run --with playwright python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          uv run --with playwright python browser_checks/save_as_contract.py
      - name: Preserve browser screenshots and debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consolidated-browser-evidence-${{ matrix.group }}
          path: |
            /tmp/sigma-chromium-setup.log
            /tmp/sigma-chromium-smoke.log
            /tmp/sigma-outcome-acceptance/sigma-increment13-*.png
            /tmp/sigma-t201-recovery.png
            /tmp/t201-api.log
            /tmp/t201-ui.log
            /tmp/project-types-api.log
            /tmp/project-types-ui.log
            /tmp/research-qa-api.log
            /tmp/research-qa-ui.log
            docs/evaluations/research_qa/*.png
            /tmp/t200-api.log
            /tmp/t200-ui.log
            /tmp/t92-api.log
            /tmp/t92-ui.log
            /tmp/save-as-api.log
            /tmp/save-as-ui.log
          if-no-files-found: ignore
          retention-days: 14

  # Preserve the existing required check name while the suites run in parallel.
  browser-gate:
    name: Browser acceptance
    if: ${{ always() }}
    needs: browser
    runs-on: ubuntu-24.04
    steps:
      - name: Require both browser groups to pass
        env:
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$BROWSER_RESULT" = "success"
