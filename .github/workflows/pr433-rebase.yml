name: PR433 rebase attempt
on:
  push:
    branches: [phase2/green-iteration-1]
    paths: [.github/workflows/pr433-rebase.yml]
permissions:
  contents: write
jobs:
  rebase:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Rebase PR 433 onto current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          echo "OLD_HEAD=$(git rev-parse HEAD)"
          echo "MAIN_HEAD=$(git rev-parse origin/main)"
          if ! git rebase origin/main; then
            echo "REBASE_CONFLICTS_BEGIN"
            git status --short
            git diff --name-only --diff-filter=U
            echo "REBASE_CONFLICTS_END"
            git rebase --abort
            exit 12
          fi
          echo "REBASED_HEAD=$(git rev-parse HEAD)"
          git push --force-with-lease origin HEAD:refs/heads/phase2/green-iteration-1
