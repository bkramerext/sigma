name: SIGMA verification

on:
  pull_request:
  push:
    branches: [main, phase2/green-iteration-1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sigma-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
      # Cloud mode and live provider access must never be enabled by this workflow.
      SIGMA_CLOUD_AUTH_ENABLED: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: ./sigma setup
      - name: Check host safety and environment-isolated lifecycle tests
        run: |
          test "$(id -u)" -ne 0
          env -u SIGMA_CLOUD_BOOTSTRAP_ADMIN_EMAIL uv run --locked --no-sync python tests/gce_host.py
          env -u SIGMA_CLOUD_BOOTSTRAP_ADMIN_EMAIL uv run --locked --no-sync python tests/tooling.py
      - name: Run full repository verification
        run: ./sigma test

