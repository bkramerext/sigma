name: Strategy scheduler semantic parity (#421)

on:
  # Temporary parity-only branch trigger while stabilizing without Actions dispatch API access.
  push:
    branches: ['chat-a/421-parity-stabilization']
  pull_request:
    branches: [main]
    paths:
      - 'src/sigma/research_sessions.py'
      - 'src/sigma/research_budget.py'
      - 'src/sigma/cloud_research.py'
      - 'tests/research_sessions.py'
      - 'tests/cloud_research.py'
      - 'tests/strategy_global_slots.py'
      - 'tests/strategy_scheduler_parity.py'
      - '.github/workflows/strategy-scheduler-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-main-parity:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.pull_request.number == 423 || github.event.pull_request.number == 426
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      SIGMA_CLOUD_AUTH_ENABLED: 'false'
      SIGMA_RESEARCH_GLOBAL_INFLIGHT: '32'
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4
        with:
          path: candidate
          persist-credentials: false
      - name: Check out immutable original sequential v1 baseline
        uses: actions/checkout@v4
        with:
          ref: 48c1fb2322a95ddcb5a218cca29fcba59c4f8108
          path: research-baseline
          persist-credentials: false
      - name: Check out immutable pre-v2 main baseline for full v1 request comparison
        uses: actions/checkout@v4
        with:
          ref: 156a13d6536e73ccafeaf0aa9d5f2e6a3bb2b176
          path: v1-main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Install synthetic-test dependencies, no live API
        run: uv sync --project candidate --locked --no-dev
      - name: Compile parity harness before executing it
        run: python -m py_compile candidate/tests/strategy_scheduler_parity.py
      - name: Run actual baseline scheduler against deterministic synthetic provider
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/research-baseline/src" \
            uv run --project candidate --locked --no-sync python \
            candidate/tests/strategy_scheduler_parity.py research-baseline baseline-parity.json
      - name: Run pre-v2 main against deterministic synthetic provider
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/v1-main/src" \
            uv run --project candidate --locked --no-sync python \
            candidate/tests/strategy_scheduler_parity.py v1-main v1-main-parity.json legacy-v1
      - name: Run candidate parallel scheduler against identical synthetic provider
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/candidate/src" \
            uv run --project candidate --locked --no-sync python \
            candidate/tests/strategy_scheduler_parity.py candidate parallel-parity.json
      - name: Verify actual v2 paired-turn session, enabled selection and peer transfers
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/candidate/src" \
            uv run --project candidate --locked --no-sync python \
            candidate/tests/strategy_scheduler_parity.py candidate paired-v2-parity.json paired-v2
      - name: Verify v2 stopped session resumes without losing committed pairs
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/candidate/src" \
            uv run --project candidate --locked --no-sync python \
            candidate/tests/strategy_scheduler_parity.py candidate paired-v2-resume-parity.json paired-v2-resume
      - name: Verify failed calls cannot falsely complete v2 and no pair is skipped
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/candidate/src:$GITHUB_WORKSPACE/candidate/tests" \
            uv run --project candidate --locked --no-sync python - <<'PY'
          from research_sessions import (
              test_paired_round_protocol_requires_every_accepted_role,
              test_paired_round_pipeline_orders_roles_without_paid_calls,
              test_paired_round_positions_are_explicit_and_legacy_is_unchanged,
              test_paired_round_scheduler_budget_rotates_and_keeps_partial_pairs,
              test_paired_round_defaults_and_enabled_call_ceiling,
          )
          test_paired_round_defaults_and_enabled_call_ceiling()
          test_paired_round_positions_are_explicit_and_legacy_is_unchanged()
          test_paired_round_protocol_requires_every_accepted_role()
          test_paired_round_pipeline_orders_roles_without_paid_calls()
          test_paired_round_scheduler_budget_rotates_and_keeps_partial_pairs()
          print("PASS: v2 paired-turn accounting, failed/missing calls, and recovery budget invariants.")
          PY
      - name: Compare complete provider inputs and reviewed research outputs
        run: |
          python - <<'PY'
          import difflib
          import json
          from pathlib import Path

          baseline = json.loads(Path("baseline-parity.json").read_text())
          v1_main = json.loads(Path("v1-main-parity.json").read_text())
          parallel = json.loads(Path("parallel-parity.json").read_text())
          v2 = json.loads(Path("paired-v2-parity.json").read_text())
          v2_resumed = json.loads(Path("paired-v2-resume-parity.json").read_text())
          if baseline["diagnostic_overlap"] or not parallel["diagnostic_overlap"]:
              raise AssertionError(
                  "The original/main and parallel runs did not exercise different dispatch ordering."
              )
          if not v1_main["diagnostic_overlap"]:
              raise AssertionError("The pre-v2 baseline should have independent strategy pipelines.")
          # The 2026 original sequential scheduler predates continuity-v2,
          # research-method inputs and scientific-v2 review metadata. Compare
          # every historical shared research datum, while keeping a separate
          # exact *entire-request* comparison against the pre-v2 main baseline.
          from collections import Counter
          from copy import deepcopy

          POLICY_ADDITIONS = {
              "blocking_reasons", "independent_verification_followups",
              "obligation_impacts", "policy_version",
          }
          COMPACT_LEDGER_METADATA = {
              "obligation_id", "legacy_obligation_id",
              "unsupplied_source_artifact_count", "withheld_basis_step_ids_count",
              "withheld_source_step_ids_count",
          }
          CONTEXT_POLICY_METADATA = {
              "assembled_context_bytes", "policy_version",
              "incomplete_unresolved_obligations",
              "mandatory_source_omitted_count", "mandatory_source_omitted_ids",
              "obligation_disposition_counts",
          }
          ORIGINAL_REQUEST_INPUTS = {
              "problem", "strategy", "cycle", "question", "project_strategy_snapshot",
              "context_artifact_ids", "other_strategy_evidence", "prior_artifacts",
              "prior_session_findings", "prior_session_findings_omitted",
              "prior_session_findings_omitted_source_ids",
              "prior_session_failures", "prior_session_failures_omitted",
              "prior_session_failure_attempt_ids",
              "prior_session_failure_omitted_attempt_ids",
              "prior_session_artifact_ids", "prior_session_obligations_omitted",
              "prior_session_obligation_omitted_ids", "obligation_ledger",
              "obligation_ledger_omitted_count", "obligation_ledger_omitted_ids",
              "outstanding_obligations", "execution_tools", "human_guidance",
              "context_manifest",
          }
          SKEPTIC_ADDITIONS = {"investigator_output", "investigator_step_id"}

          def historical_context(manifest):
              # Different versioned source *selection rules* may choose a
              # different representation, but not change which saved sources
              # or omission pointers exist in this bounded synthetic case.
              assert manifest["omitted_count"] >= 0
              assert manifest["selected_count"] >= 0
              if "mandatory_source_omitted_count" in manifest:
                  assert manifest["mandatory_source_omitted_count"] == 0
                  assert not manifest["mandatory_source_omitted_ids"]
                  assert manifest["incomplete_unresolved_obligations"]["count"] == 0
              view = {
                  key: value for key, value in manifest.items()
                  if key not in CONTEXT_POLICY_METADATA
              }
              view["omitted_obligations"] = {
                  key: value for key, value in view["omitted_obligations"].items()
                  if key != "reason"
              }
              view["sources"] = [
                  {key: value for key, value in source.items()
                   if key not in {"reason", "representation"}}
                  for source in view["sources"]
              ]
              return view

          def historical_ledger(rows, manifest):
              # Continuity-v2 merges duplicate descriptions, but all source
              # artifacts are still compared in full below. Do not lose any
              # unique text/status combination or its original provenance.
              counted = Counter(row["status"] for row in rows)
              for status, count in counted.items():
                  assert manifest["obligation_disposition_counts"][status] == count
              result = {}
              for row in rows:
                  assert row["text"] and row["status"] and row["obligation_id"]
                  key = (row["text"], row["status"])
                  core = {k: v for k, v in row.items() if k not in COMPACT_LEDGER_METADATA}
                  result.setdefault(key, core)
              return list(result.values())

          def historical_request(row):
              input_data = row["payload"]["input"]
              required = ORIGINAL_REQUEST_INPUTS | (
                  SKEPTIC_ADDITIONS if row["role"] == "research_skeptic" else set()
              )
              assert required <= set(input_data), (row["title"], required - set(input_data))
              assert row["payload"]["model"] and row["payload"]["text"]["format"]["name"] == row["role"]
              core = {key: input_data[key] for key in required}
              core["obligation_ledger"] = historical_ledger(
                  core["obligation_ledger"], core["context_manifest"]
              )
              core["outstanding_obligations"] = list(
                  dict.fromkeys(core["outstanding_obligations"])
              )
              core["context_manifest"] = historical_context(core["context_manifest"])
              return {
                  "title": row["title"], "cycle": row["cycle"],
                  "role": row["role"], "model": row["payload"]["model"], "input": core,
              }

          def historical_review(review):
              if review.get("policy_version") == "scientific-v2":
                  assert "objective_not_achieved" in review["blocking_reasons"]
                  assert not review["independent_verification_followups"]
                  assert review["obligation_impacts"]
                  for item in review["obligation_impacts"]:
                      assert item["text"] and item["rationale"]
                      assert item["impact"] == "undetermined"
                      assert isinstance(item["basis_step_numbers"], list)
              else:
                  assert not POLICY_ADDITIONS.intersection(review)
              return {key: value for key, value in review.items()
                      if key not in POLICY_ADDITIONS}

          def historical_projection(semantic):
              return {
                  "provider_requests": [
                      historical_request(row) for row in semantic["provider_requests"]
                  ],
                  "artifacts": [
                      {**item, "objective_review": historical_review(item["objective_review"])}
                      for item in semantic["artifacts"]
                  ],
                  "branches": semantic["branches"],
                  "assessment": semantic["assessment"],
              }

          def identical(label, left_data, right_data):
              if left_data == right_data:
                  return
              left = json.dumps(left_data, sort_keys=True, indent=2).splitlines()
              right = json.dumps(right_data, sort_keys=True, indent=2).splitlines()
              print("\n".join(list(difflib.unified_diff(
                  left, right, fromfile=label + " baseline",
                  tofile=label + " candidate", lineterm=""
              ))[:300]))
              raise AssertionError("Research semantics changed: " + label)

          # Full provider wire inputs, instructions, JSON schemas, review
          # evidence and outcomes must be *exactly* the same across the
          # immediate pre-v2 and candidate v1 scheduler implementations.
          identical("pre-v2 main versus candidate v1",
                    v1_main["semantic"], parallel["semantic"])
          # Older sequential v1 uses historical methodology, context and
          # obligation formats. Explicitly validate versioned additions above,
          # then compare the entire shared research substance.
          identical("original sequential versus candidate v1",
                    historical_projection(baseline["semantic"]),
                    historical_projection(parallel["semantic"]))

          def normalized_resume_semantic(source):
              result = deepcopy(source)
              for row in result["provider_requests"]:
                  context = row["payload"]["input"]
                  # These are sets displayed as arrays; stop/resume may reload
                  # them in another order. Membership and fields are identical.
                  snapshot = context["project_strategy_snapshot"]
                  assert len(snapshot) == len({x["id"] for x in snapshot})
                  context["project_strategy_snapshot"] = sorted(
                      snapshot, key=lambda x: (x["title"], x["id"])
                  )
                  for item in context["context_manifest"]["sources"]:
                      if "source_ids" in item:
                          assert len(item["source_ids"]) == len(set(item["source_ids"]))
                          item["source_ids"] = sorted(item["source_ids"])
              return result

          for item in (v2, v2_resumed):
              if not item["diagnostic_overlap"] or item["counts"] != {
                  "calls": 16, "artifacts": 8, "pair_slots": 4,
                  "enabled_strategies": 2,
                  "resumed": item["scheduler_mode"] == "paired-v2-resume",
              }:
                  raise AssertionError(
                      "V2 paired-turn run did not preserve complete accepted pairs."
                  )
              for row in item["semantic"]["artifacts"]:
                  historical_review(row["objective_review"])
          # Compare all recovered v2 provider inputs, peer evidence, handoffs,
          # coordinator decisions, reviewed artifacts, branches and outcomes.
          identical("v2 uninterrupted versus resumed",
                    normalized_resume_semantic(v2["semantic"]),
                    normalized_resume_semantic(v2_resumed["semantic"]))
          print("PASS: original sequential v1, pre-v2 main, current v1, and both "
                "v2 paired-turn runs retain provider inputs, peer handoffs, "
                "reviewed artifacts, coordinator decisions and outcomes.")
          PY
      - name: Verify real local admission and 32 global provider slots across processes
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/candidate/src" \
            uv run --project candidate --locked --no-sync python \
            candidate/tests/strategy_global_slots.py
      - name: Validate stop/resume on baseline revision
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/research-baseline/src:$GITHUB_WORKSPACE/research-baseline/tests" uv run --project candidate --locked --no-sync python - <<'PY'
          import asyncio
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from research_sessions import (
              test_peer_finding_changes_target_investigator_after_stop_and_resume,
              test_portfolio_preflight_timeout_pauses_without_spending_calls_and_recovers,
          )
          with TemporaryDirectory() as root:
              base = Path(root)
              asyncio.run(test_peer_finding_changes_target_investigator_after_stop_and_resume(base / "peer.sigma"))
              asyncio.run(test_portfolio_preflight_timeout_pauses_without_spending_calls_and_recovers(base / "timeout.sigma"))
          print("Baseline: stop/resume and timeout recovery passed.")
          PY
      - name: Validate stop/resume handoff and timeout recovery on parallel branch
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/candidate/src:$GITHUB_WORKSPACE/candidate/tests" uv run --project candidate --locked --no-sync python - <<'PY'
          import asyncio
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from research_sessions import (
              test_peer_finding_changes_target_investigator_after_stop_and_resume,
              test_portfolio_preflight_timeout_pauses_without_spending_calls_and_recovers,
          )
          with TemporaryDirectory() as root:
              base = Path(root)
              asyncio.run(test_peer_finding_changes_target_investigator_after_stop_and_resume(base / "peer.sigma"))
              asyncio.run(test_portfolio_preflight_timeout_pauses_without_spending_calls_and_recovers(base / "timeout.sigma"))
          print("Parallel branch: stop/resume and timeout recovery passed.")
          PY
      - name: Upload synthetic diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: strategy-parity-snapshots
          path: '*-parity.json'
          if-no-files-found: ignore
