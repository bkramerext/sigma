name: Public Samples browser acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sigma-public-samples-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-samples:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked project and browser dependencies
        run: ./sigma setup
      - name: Install isolated Chromium for Playwright
        run: uv run --with playwright python -m playwright install --with-deps chromium
      - name: Verify starred sample PDF as unsigned guest without AI
        shell: bash
        run: |
          export SIGMA_BROWSER_EXECUTABLE="$(uv run --with playwright python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          uv run --with playwright python browser_checks/guest_samples.py
