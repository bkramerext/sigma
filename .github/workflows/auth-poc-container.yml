name: Container-local ChatGPT OAuth POC

on:
  push:
    branches:
      - coordinator/containerized-chatgpt-auth-poc
    paths:
      - 'auth-poc/**'
      - 'deploy/auth-poc.compose.yaml'
      - 'deploy/auth-poc.gce.yaml'
      - 'deploy/release_image.py'
      - 'deploy/start-gce.sh'
      - 'deploy/deploy-gce-release.py'
      - 'deploy/gce_preflight.py'
      - '.github/workflows/auth-poc-container.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify GCE Compose overlay remains nonpublic and persistent
        shell: bash
        run: |
          set -euo pipefail
          SIGMA_RELEASE="$GITHUB_SHA" \
          SIGMA_DOMAIN="sigma.example.invalid" \
          SIGMA_TLS_EMAIL="admin@example.invalid" \
          SIGMA_CLOUD_ADMIN_CONTACT_EMAIL="admin@example.invalid" \
          GOOGLE_OIDC_CLIENT_ID="example.apps.googleusercontent.com" \
          SIGMA_INVITATION_SMTP_USERNAME="admin@example.invalid" \
          SIGMA_GOOGLE_OIDC_CLIENT_SECRET_FILE="/tmp/dummy" \
          SIGMA_CLOUD_OPENAI_API_KEY_FILE="/tmp/dummy" \
          SIGMA_INVITATION_SMTP_PASSWORD_FILE="/tmp/dummy" \
          SIGMA_SANDBOX_DOCKER_SOCKET="/tmp/dummy-docker.sock" \
          SIGMA_SANDBOX_DOCKER_GID="10001" \
          SIGMA_STATE_DISK_MOUNT="/srv/sigma-state" \
          docker compose -f deploy/compose.yaml -f deploy/compose.gce.yaml \
            -f deploy/auth-poc.compose.yaml -f deploy/auth-poc.gce.yaml \
            config --format json > /tmp/auth-poc-gce-compose.json
          python3 -c 'import json; c=json.load(open("/tmp/auth-poc-gce-compose.json")); a=c["services"]["auth-poc"]; b=c["services"]["browser"]; assert not a.get("ports"), a.get("ports"); assert not b.get("ports"), b.get("ports"); assert a["image"]=="sigma-auth-poc:"+__import__("os").environ["GITHUB_SHA"]; assert b["image"]=="sigma-auth-browser-poc:"+__import__("os").environ["GITHUB_SHA"]; assert a["environment"]["SIGMA_AUTH_POC_REAL_SIGNIN"]=="0"; assert not b.get("volumes"), b.get("volumes"); assert c["volumes"]["auth-poc-state"]["driver_opts"]["device"]=="/srv/sigma-state/auth/auth-poc"'
      - name: Build and run production-architecture Linux/amd64 image
        run: docker compose -f deploy/auth-poc.compose.yaml up -d --build --wait
      - name: Verify browser and worker are isolated
        shell: bash
        run: |
          set -euo pipefail
          worker=$(docker compose -f deploy/auth-poc.compose.yaml ps -q auth-poc)
          browser=$(docker compose -f deploy/auth-poc.compose.yaml ps -q browser)
          worker_mounts=$(docker inspect "$worker" --format '{{json .Mounts}}')
          browser_mounts=$(docker inspect "$browser" --format '{{json .Mounts}}')
          [[ "$worker_mounts" == *auth-poc-state* ]] || { echo "Worker missing credential volume"; exit 1; }
          [[ "$browser_mounts" != *auth-poc-state* ]] || { echo "Browser can access credentials"; exit 1; }
          [[ $(docker inspect "$browser" --format '{{.HostConfig.NetworkMode}}') == container:* ]] || { echo "Browser not sharing localhost"; exit 1; }
          docker compose -f deploy/auth-poc.compose.yaml exec -T browser python3 -c 'import urllib.request; assert urllib.request.urlopen("http://127.0.0.1:8001/health", timeout=3).status==200'
          docker compose -f deploy/auth-poc.compose.yaml exec -T auth-poc sh -c '! command -v chromium'
      - name: Verify two isolated user-scoped stacks
        shell: bash
        run: |
          set -euo pipefail
          export SIGMA_AUTH_POC_PORT=16081
          docker compose -p sigma-auth-user-b -f deploy/auth-poc.compose.yaml up -d --no-build --wait auth-poc
          unset SIGMA_AUTH_POC_PORT
          a=$(docker compose -f deploy/auth-poc.compose.yaml ps -q auth-poc)
          b=$(SIGMA_AUTH_POC_PORT=16081 docker compose -p sigma-auth-user-b -f deploy/auth-poc.compose.yaml ps -q auth-poc)
          [[ "$a" != "$b" ]] || exit 1
          a_vol=$(docker inspect "$a" --format '{{range .Mounts}}{{if eq .Destination "/var/lib/sigma-poc-auth"}}{{.Name}}{{end}}{{end}}')
          b_vol=$(docker inspect "$b" --format '{{range .Mounts}}{{if eq .Destination "/var/lib/sigma-poc-auth"}}{{.Name}}{{end}}{{end}}')
          [[ -n "$a_vol" && -n "$b_vol" && "$a_vol" != "$b_vol" ]] || { echo "Auth volume collision across users"; exit 1; }
          SIGMA_AUTH_POC_PORT=16081 docker compose -p sigma-auth-user-b -f deploy/auth-poc.compose.yaml exec -T auth-poc /opt/venv/bin/python /opt/sigma/auth-poc/test_loopback.py
      - name: Verify synthetic OAuth loopback and PKCE inside container
        run: docker compose -f deploy/auth-poc.compose.yaml exec -T auth-poc /opt/venv/bin/python /opt/sigma/auth-poc/test_loopback.py
      - name: Prove browser-to-worker callback over shared localhost
        shell: bash
        run: |
          set -euo pipefail
          # The test helper runs only on the credential worker and exposes only
          # an invalid-state callback target, never real OAuth material.
          docker compose -f deploy/auth-poc.compose.yaml exec -d auth-poc \
            /opt/venv/bin/python /opt/sigma/auth-poc/test_cross_container.py
          docker compose -f deploy/auth-poc.compose.yaml exec -T browser python3 - <<'PY'
          import time
          import urllib.error
          import urllib.request

          base = "http://127.0.0.1:19091"
          for _ in range(80):
              try:
                  with urllib.request.urlopen(base + "/target", timeout=1) as response:
                      callback_url = response.read().decode("ascii")
                  break
              except (urllib.error.URLError, TimeoutError):
                  time.sleep(0.1)
          else:
              raise AssertionError("OAuth test worker never started")

          # The request originates in the distinct browser container,
          # traverses Docker's shared network namespace, and reaches the
          # existing ephemeral loopback callback listener.
          with urllib.request.urlopen(callback_url, timeout=5) as response:
              body = response.read()
              assert response.status == 200  # Neutral callback, even on rejection.
              assert b"Return to SIGMA" in body

          with urllib.request.urlopen(base + "/done", timeout=3) as response:
              assert response.read() == b"PASS", "Invalid state was consumed"
          print("PASS: distinct Chromium container reached OAuth loopback listener")
          PY
      - name: Diagnose Chromium namespace sandbox without credentials
        shell: bash
        run: |
          set -euo pipefail
          # Diagnostics only: isolated, networkless, disposable container.
          # No OpenAI pages, account data, volumes or host sockets.
          for mode in default permissive-seccomp-probe; do
            args=(--rm --network none --read-only --cap-drop ALL
              --security-opt no-new-privileges --pids-limit 128
              --tmpfs /tmp:rw,nosuid,size=512m,uid=11001,gid=11001)
            if [[ "$mode" == permissive-seccomp-probe ]]; then
              args+=(--security-opt seccomp=unconfined)
            fi
            set +e
            output=$(timeout 18 docker run "${args[@]}" \
              --entrypoint /usr/bin/chromium sigma-auth-browser-poc:local \
              --headless --disable-gpu --disable-dev-shm-usage --no-first-run \
              --user-data-dir=/tmp/chromium-test --dump-dom about:blank 2>&1)
            rc=$?
            set -e
            if [[ $rc -eq 0 && "$output" == *"<html"* ]]; then
              echo "SANDBOX_PROBE $mode: chromium launched without --no-sandbox"
            else
              echo "SANDBOX_PROBE $mode: blocked (exit=$rc)"
              printf '%s\\n' "$output" | tail -12
            fi
          done
          # This is a diagnostic experiment, not a sandbox acceptance pass.
          # Neither probe is used for real account sign-in or the hosted app.
      - name: Verify remote browser is accessible only over host loopback
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error http://127.0.0.1:16080/vnc.html >/dev/null
          bind=$(docker compose -f deploy/auth-poc.compose.yaml port auth-poc 6080)
          [[ "$bind" == 127.0.0.1:* ]] || { echo "Unexpected noVNC bind: $bind"; exit 1; }
          docker compose -f deploy/auth-poc.compose.yaml exec -T auth-poc             /opt/venv/bin/python -c 'import json, urllib.request; v=json.load(urllib.request.urlopen("http://127.0.0.1:8001/health")); assert v["ready"], v'
          docker compose -f deploy/auth-poc.compose.yaml exec -T auth-poc             /opt/venv/bin/python -c 'import urllib.request; html=urllib.request.urlopen("http://127.0.0.1:8001/").read(); assert b"Open ChatGPT account chooser" in html'
      - name: Verify browser-origin gate
        run: docker compose -f deploy/auth-poc.compose.yaml exec -T auth-poc /opt/venv/bin/python /opt/sigma/auth-poc/test_security.py
      - name: Inspect failures (no login is performed in CI)
        if: failure()
        run: docker compose -f deploy/auth-poc.compose.yaml ps
      - name: Diagnose Chromium startup (CI only, no OpenAI sign-in)
        if: failure()
        run: |
          docker compose -f deploy/auth-poc.compose.yaml logs --no-color --tail=70 browser || true
          docker compose -f deploy/auth-poc.compose.yaml exec -T browser sh -c 'timeout 8 /usr/bin/chromium --headless --disable-gpu --dump-dom about:blank 2>&1 | tail -35' || true
          docker compose -f deploy/auth-poc.compose.yaml exec -T browser sh -c 'ps -ef | grep -E "chromium|Xvfb|x11vnc|websockify" | head -25' || true
      - name: Clean up POC containers and credentials
        if: always()
        run: |
          SIGMA_AUTH_POC_PORT=16081 docker compose -p sigma-auth-user-b -f deploy/auth-poc.compose.yaml down -v --remove-orphans || true
          docker compose -f deploy/auth-poc.compose.yaml down -v --remove-orphans
