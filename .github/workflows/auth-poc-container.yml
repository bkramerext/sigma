name: Container-local ChatGPT OAuth POC

on:
  pull_request:
    paths:
      - 'auth-poc/**'
      - 'src/sigma/personal_browser_proxy.py'
      - 'src/sigma/model_dispatch.py'
      - 'tests/auth_poc_local_launcher.py'
      - 'tests/shared_personal_vault.py'
      - 'deploy/personal-shared.compose.yaml'
      - 'src/sigma/ai_store.py'
      - 'src/sigma/local_personal.py'
      - 'src/sigma/personal_browser.py'
      - 'src/sigma/personal_inference.py'
      - 'src/sigma/model_dispatch.py'
      - '.github/workflows/auth-poc-container.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-smoke:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    env:
      SIGMA_RELEASE: "${{ github.sha }}"
      SIGMA_AUTH_POC_RPC_SEED: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      SIGMA_AUTH_POC_CHECKOUT_ID: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      SIGMA_AUTH_POC_LOCAL_UID: "10001"
      SIGMA_SHARED_PLATFORM: "${{ matrix.platform }}"
    steps:
      - uses: actions/checkout@v4
      - name: Validate exactly one shared service and private ports
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f deploy/personal-shared.compose.yaml config --format json > /tmp/shared-config.json
          python3 - <<'PY'
          import json
          c=json.load(open("/tmp/shared-config.json"))
          assert set(c["services"]) == {"personal"}, c["services"].keys()
          p=c["services"]["personal"]
          assert p["read_only"] is True
          import os
          assert p["platform"] == os.environ["SIGMA_SHARED_PLATFORM"]
          limit=p["mem_limit"]
          if isinstance(limit, str):
              if limit.isdecimal():
                  limit=int(limit)
              else:
                  suffix=limit[-1].lower()
                  limit=int(limit[:-1])*{"k":1024,"m":1024**2,"g":1024**3}[suffix]
          assert limit <= 2 * 1024 * 1024 * 1024
          assert {x["target"] for x in p["ports"]} == {8001,6080}
          assert all(x["host_ip"]=="127.0.0.1" for x in p["ports"])
          assert p["cap_drop"]==["ALL"]
          assert "SYS_CHROOT" in p["cap_add"]
          assert "no-new-privileges:true" in p["security_opt"]
          assert not p.get("privileged")
          assert len(p["volumes"])==2
          print("PASS one bounded nonpublic service, separate records and key volumes")
          PY
      - name: Check opt-in GCE loopback routing and host Caddy syntax
        shell: bash
        env:
          SIGMA_DOMAIN: sigma.example.invalid
          SIGMA_TLS_EMAIL: ops@example.invalid
          SIGMA_CLOUD_ADMIN_CONTACT_EMAIL: ops@example.invalid
          GOOGLE_OIDC_CLIENT_ID: dummy.apps.googleusercontent.com
          SIGMA_INVITATION_SMTP_USERNAME: ops@example.invalid
          SIGMA_GOOGLE_OIDC_CLIENT_SECRET_FILE: /tmp/dummy-google-secret
          SIGMA_CLOUD_OPENAI_API_KEY_FILE: /tmp/dummy-openai-key
          SIGMA_INVITATION_SMTP_PASSWORD_FILE: /tmp/dummy-smtp-password
          SIGMA_SANDBOX_DOCKER_SOCKET: /tmp/sandbox-docker.sock
          SIGMA_SANDBOX_DOCKER_GID: "10001"
          SIGMA_STATE_DISK_MOUNT: /srv/sigma-state
        run: |
          set -euo pipefail
          docker compose -f deploy/compose.yaml -f deploy/compose.gce.yaml \
            -f deploy/compose.direct.gce.yaml config --format json > /tmp/sigma-host-direct.json
          python3 - <<'PY'
          import json
          c=json.load(open('/tmp/sigma-host-direct.json'))
          services=c['services']
          assert set(services)=={'backend','frontend','edge'}
          for name, target, published in [('backend',8000,'18081'),('frontend',8080,'18082')]:
              ports=services[name]['ports']
              assert len(ports)==1 and ports[0]['host_ip']=='127.0.0.1'
              assert ports[0]['target']==target and str(ports[0]['published'])==published
          assert services['edge']['ports'][0]['host_ip']=='127.0.0.1'
          print('PASS host direct routing exposes only internal loopback endpoints')
          PY
          mkdir -p /tmp/sigma-caddy-check/sigma-maintenance
          touch /tmp/sigma-caddy-check/sigma-maintenance/empty.caddy
          docker run --rm \
            -v "$PWD/deploy/host-caddy-direct.Caddyfile:/etc/caddy/Caddyfile:ro" \
            -v "/tmp/sigma-caddy-check/sigma-maintenance:/etc/caddy/sigma-maintenance:ro" \
            --entrypoint caddy caddy:2.9.1-alpine \
            validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker run --rm \
            -v "$PWD/deploy/host-caddy-direct.Caddyfile:/etc/caddy/Caddyfile:ro" \
            -v "/tmp/sigma-caddy-check/sigma-maintenance:/etc/caddy/sigma-maintenance:ro" \
            --entrypoint caddy caddy:2.9.1-alpine \
            adapt --config /etc/caddy/Caddyfile --adapter caddyfile \
            | python3 deploy/check_host_direct_caddy.py
      - name: Build and launch single worker/browser image
        run: docker compose -p sigma-shared-ci -f deploy/personal-shared.compose.yaml up -d --build --wait
      - name: Verify one shared container and no GUI at idle
        shell: bash
        run: |
          set -euo pipefail
          count=$(docker compose -p sigma-shared-ci -f deploy/personal-shared.compose.yaml ps -q | wc -l)
          test "$count" -eq 1
          container=$(docker compose -p sigma-shared-ci -f deploy/personal-shared.compose.yaml ps -q personal)
          test "$(docker inspect "$container" --format '{{.State.Health.Status}}')" = healthy
          docker compose -p sigma-shared-ci -f deploy/personal-shared.compose.yaml exec -T personal \
            /opt/venv/bin/python -c "import urllib.request,json; assert json.load(urllib.request.urlopen('http://127.0.0.1:8001/health'))['healthy']"
          docker stats --no-stream --format '{{.Name}} {{.MemUsage}}' "$container"
      - name: Shared vault, RPC, real sandboxed browser lifecycle, and two-user boundary
        shell: bash
        run: |
          set -euo pipefail
          docker compose -p sigma-shared-ci -f deploy/personal-shared.compose.yaml exec -T personal \
            /usr/bin/setpriv --reuid=10001 --regid=10001 --clear-groups \
            /opt/venv/bin/python /opt/sigma/auth-poc/test_shared_runtime.py
          docker compose -p sigma-shared-ci -f deploy/personal-shared.compose.yaml exec -T personal \
            /usr/bin/setpriv --reuid=11001 --regid=11001 --clear-groups \
            /opt/venv/bin/python -c 'import os; assert not os.access("/var/lib/sigma-shared-key", os.X_OK), "Browser UID can traverse private key directory"'
          docker compose -p sigma-shared-ci -f deploy/personal-shared.compose.yaml exec -T personal \
            /usr/bin/setpriv --reuid=10001 --regid=10001 --clear-groups \
            /opt/venv/bin/python /opt/sigma/auth-poc/test_shared_oauth_lifecycle.py
          docker compose -p sigma-shared-ci -f deploy/personal-shared.compose.yaml exec -T personal \
            /usr/bin/setpriv --reuid=10001 --regid=10001 --clear-groups \
            /opt/venv/bin/python /opt/sigma/auth-poc/test_shared_inference.py
          container=$(docker compose -p sigma-shared-ci -f deploy/personal-shared.compose.yaml ps -q personal)
          docker stats --no-stream --format '{{.Name}} {{.MemUsage}}' "$container"
      - name: Verify encrypted user credentials survive shared worker restart
        shell: bash
        run: |
          set -euo pipefail
          cid=$(docker compose -p sigma-shared-ci -f deploy/personal-shared.compose.yaml ps -q personal)
          docker compose -p sigma-shared-ci -f deploy/personal-shared.compose.yaml stop --timeout 45 personal
          # SIGTERM should exit normally rather than exhausting the grace
          # period and being killed by Docker (exit code 137).
          test "$(docker inspect "$cid" --format '{{.State.ExitCode}}')" = 0
          docker compose -p sigma-shared-ci -f deploy/personal-shared.compose.yaml up -d --no-build --wait
          docker compose -p sigma-shared-ci -f deploy/personal-shared.compose.yaml exec -T personal \
            /usr/bin/setpriv --reuid=10001 --regid=10001 --clear-groups \
            /opt/venv/bin/python /opt/sigma/auth-poc/test_shared_persistence.py
      - name: Diagnose isolated CI container startup
        if: failure()
        shell: bash
        run: |
          set +e
          docker compose -p sigma-shared-ci -f deploy/personal-shared.compose.yaml ps -a
          docker compose -p sigma-shared-ci -f deploy/personal-shared.compose.yaml \
            logs --no-color --tail=100 personal
          cid=$(docker compose -p sigma-shared-ci -f deploy/personal-shared.compose.yaml ps -a -q personal)
          if [ -n "$cid" ]; then
            docker inspect "$cid" --format 'exit_code={{.State.ExitCode}} oom={{.State.OOMKilled}} status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}'
          fi
      - name: Remove POC service after tests
        if: always()
        run: docker compose -p sigma-shared-ci -f deploy/personal-shared.compose.yaml down --remove-orphans
