name: T249 project bundle verification
on:
  pull_request:
    paths:
      - 'src/sigma/project_bundle.py'
      - 'src/sigma/projects.py'
      - 'src/sigma/research_sessions.py'
      - 'tests/project_bundle.py'
      - '.github/workflows/t249-project-bundle.yml'
  workflow_dispatch:
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e .
      - name: Compile touched modules
        run: python -m py_compile src/sigma/projects.py src/sigma/project_bundle.py src/sigma/research_sessions.py tests/project_bundle.py
      - name: Execute project round-trip and public API tests
        run: python tests/project_bundle.py
