name: T249 project bundle verification
on:
  pull_request:
    paths:
      - 'src/sigma/project_bundle.py'
      - 'src/sigma/projects.py'
      - 'src/sigma/api.py'
      - 'frontend/src/main.tsx'
      - 'tests/project_creation.py'
      - 'tests/t249_docker_lifecycle.py'
      - 'src/sigma/research_sessions.py'
      - 'src/sigma/python_sandbox.py'
      - 'tests/project_bundle.py'
      - '.github/workflows/t249-project-bundle.yml'
  workflow_dispatch:
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e .
      - name: Compile touched modules
        run: python -m compileall -q src/sigma tests/project_bundle.py tests/project_creation.py tests/t249_docker_lifecycle.py
      - name: Execute project round-trip and public API tests
        run: python tests/project_bundle.py
      - name: Execute project creation simulation
        run: python tests/project_creation.py
      - name: Execute Docker lifecycle and artifact persistence
        run: python tests/t249_docker_lifecycle.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
