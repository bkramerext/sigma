<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 478" role="img" aria-labelledby="workflowTitle workflowDescription">
<title id="workflowTitle">SIGMA research workflow</title>
<desc id="workflowDescription">Six stages in two rows. Follow the copper arrows from Project to Strategies to Research, curve down to Refine, then go left through Optional paper to Review/export.</desc>
<defs>
<linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070d16"/><stop offset=".52" stop-color="#0a1729"/><stop offset="1" stop-color="#080e19"/></linearGradient>
<radialGradient id="amberHalo" cx=".85" cy=".26" r=".75"><stop stop-color="#b36528" stop-opacity=".22"/><stop offset=".45" stop-color="#5c371c" stop-opacity=".08"/><stop offset="1" stop-color="#040c16" stop-opacity="0"/></radialGradient>
<radialGradient id="blueHalo" cx=".16" cy=".88" r=".72"><stop stop-color="#236089" stop-opacity=".15"/><stop offset="1" stop-color="#060d18" stop-opacity="0"/></radialGradient>
<linearGradient id="copperStroke" x1="0" y1="0" x2="1" y2=".35"><stop stop-color="#81451e"/><stop offset=".22" stop-color="#e9aa63"/><stop offset=".42" stop-color="#f2c58b"/><stop offset=".68" stop-color="#aa592a"/><stop offset="1" stop-color="#e6a762"/></linearGradient>
<linearGradient id="cardFill" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#18304a"/><stop offset=".27" stop-color="#111b2a"/><stop offset=".78" stop-color="#090f1c"/><stop offset="1" stop-color="#1b1820"/></linearGradient>
<linearGradient id="metalShine" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff1cf" stop-opacity=".37"/><stop offset=".3" stop-color="#eaaa60" stop-opacity=".06"/><stop offset="1" stop-color="#d98540" stop-opacity="0"/></linearGradient>
<linearGradient id="arrowCopper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e5a568"/><stop offset=".50" stop-color="#ffcd90"/><stop offset="1" stop-color="#b36e3f"/></linearGradient>
<pattern id="grid" width="47" height="47" patternUnits="userSpaceOnUse"><path d="M47 0H0V47" fill="none" stroke="#5384ad" stroke-width=".45" opacity=".15"/></pattern>
<filter id="cardShadow" x="-.12" y="-.26" width="1.25" height="1.65"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#01040a" flood-opacity=".64"/></filter>
<filter id="routeGlow" x="-.2" y="-.3" width="1.4" height="1.6"><feGaussianBlur stdDeviation="3"/></filter>
<marker id="arrowRight" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#efb377"/></marker>
</defs>
<rect x=".5" y=".5" width="1023" height="477" rx="17" fill="url(#backdrop)" stroke="#75523a" stroke-opacity=".65"/>
<rect x="1" y="1" width="1022" height="476" rx="17" fill="url(#amberHalo)"/>
<rect x="1" y="1" width="1022" height="476" rx="17" fill="url(#blueHalo)"/>
<rect x="1" y="1" width="1022" height="476" rx="17" fill="url(#grid)"/>
<g fill="none" stroke="#5a8cb5" stroke-opacity=".13" stroke-width="1"><path d="M-90 440C190 380 215 60 560 -80"/><path d="M155 520C320 182 640 200 1030 40"/><path d="M580 560C670 288 840 90 1090 92"/></g>
<g fill="#d6a66e" opacity=".46"><circle cx="154" cy="48" r="1.2"/><circle cx="336" cy="73" r="1.3"/><circle cx="520" cy="48" r="1"/><circle cx="770" cy="56" r="1.5"/><circle cx="958" cy="91" r="1.1"/><circle cx="93" cy="284" r="1.3"/><circle cx="222" cy="250" r=".8"/><circle cx="512" cy="274" r="1.6"/><circle cx="821" cy="274" r=".9"/><circle cx="951" cy="440" r="1"/></g>
<g font-family="Arial,Helvetica,sans-serif" fill="#c3a58c" font-size="11.5" letter-spacing="2.5"><text x="60" y="57">THE RESEARCH LOOP</text><text x="961" y="57" text-anchor="end" fill="#6888a2" letter-spacing="1.5">HUMAN-GUIDED  /  RESOURCE-AWARE</text></g>
<g fill="none" stroke="#c9834c" stroke-opacity=".30" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#routeGlow)">
<path d="M311 161 H350"/><path d="M609 161 H648"/><path d="M907 161 H931 Q961 161 961 191 V339 Q961 365 935 365 H910"/><path d="M653 365 H615"/><path d="M355 365 H317"/></g>
<g fill="none" stroke="url(#arrowCopper)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
<path d="M311 161 H350" marker-end="url(#arrowRight)"/><path d="M609 161 H648" marker-end="url(#arrowRight)"/>
<path d="M907 161 H931 Q961 161 961 191 V339 Q961 365 935 365 H910" marker-end="url(#arrowRight)"/>
<path d="M653 365 H615" marker-end="url(#arrowRight)"/><path d="M355 365 H317" marker-end="url(#arrowRight)"/>
</g>
<g aria-label="Stage 1: Define the research question and scope.">
<title>Project — Define the research question and scope.</title>
<rect x="60" y="108" width="248" height="106" rx="11" fill="#b76a2e" opacity=".26" filter="url(#cardShadow)"/>
<rect x="60" y="108" width="248" height="106" rx="11" fill="url(#cardFill)" stroke="url(#copperStroke)" stroke-width="2.25"/>
<rect x="65" y="113" width="238" height="96" rx="7" fill="none" stroke="#f2c590" stroke-width=".7" opacity=".28"/>
<path d="M73 115 H296" stroke="url(#metalShine)" stroke-width="2"/>
<rect x="72" y="130" width="2" height="61" rx="1" fill="#ecad6e" opacity=".74"/>
<text x="88" y="139" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="700" letter-spacing="2.1" fill="#dba879">01</text>
<text x="88" y="183" font-family="Georgia,'Times New Roman',serif" font-size="26" fill="#f2e2d4">Project</text>
</g>
<g aria-label="Stage 2: Develop and compare approaches.">
<title>Strategies — Develop and compare approaches.</title>
<rect x="358" y="108" width="248" height="106" rx="11" fill="#b76a2e" opacity=".26" filter="url(#cardShadow)"/>
<rect x="358" y="108" width="248" height="106" rx="11" fill="url(#cardFill)" stroke="url(#copperStroke)" stroke-width="2.25"/>
<rect x="363" y="113" width="238" height="96" rx="7" fill="none" stroke="#f2c590" stroke-width=".7" opacity=".28"/>
<path d="M371 115 H594" stroke="url(#metalShine)" stroke-width="2"/>
<rect x="370" y="130" width="2" height="61" rx="1" fill="#ecad6e" opacity=".74"/>
<text x="386" y="139" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="700" letter-spacing="2.1" fill="#dba879">02</text>
<text x="386" y="183" font-family="Georgia,'Times New Roman',serif" font-size="26" fill="#f2e2d4">Strategies</text>
</g>
<g aria-label="Stage 3: Investigator and Skeptic examine each strategy.">
<title>Research — Investigator and Skeptic examine each strategy.</title>
<rect x="656" y="108" width="248" height="106" rx="11" fill="#b76a2e" opacity=".26" filter="url(#cardShadow)"/>
<rect x="656" y="108" width="248" height="106" rx="11" fill="url(#cardFill)" stroke="url(#copperStroke)" stroke-width="2.25"/>
<rect x="661" y="113" width="238" height="96" rx="7" fill="none" stroke="#f2c590" stroke-width=".7" opacity=".28"/>
<path d="M669 115 H892" stroke="url(#metalShine)" stroke-width="2"/>
<rect x="668" y="130" width="2" height="61" rx="1" fill="#ecad6e" opacity=".74"/>
<text x="684" y="139" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="700" letter-spacing="2.1" fill="#dba879">03</text>
<text x="684" y="183" font-family="Georgia,'Times New Roman',serif" font-size="26" fill="#f2e2d4">Research</text>
</g>
<g aria-label="Stage 4: Inspect findings; revise or continue the inquiry.">
<title>Refine — Inspect findings; revise or continue the inquiry.</title>
<rect x="656" y="312" width="248" height="106" rx="11" fill="#b76a2e" opacity=".26" filter="url(#cardShadow)"/>
<rect x="656" y="312" width="248" height="106" rx="11" fill="url(#cardFill)" stroke="url(#copperStroke)" stroke-width="2.25"/>
<rect x="661" y="317" width="238" height="96" rx="7" fill="none" stroke="#f2c590" stroke-width=".7" opacity=".28"/>
<path d="M669 319 H892" stroke="url(#metalShine)" stroke-width="2"/>
<rect x="668" y="334" width="2" height="61" rx="1" fill="#ecad6e" opacity=".74"/>
<text x="684" y="343" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="700" letter-spacing="2.1" fill="#dba879">04</text>
<text x="684" y="387" font-family="Georgia,'Times New Roman',serif" font-size="26" fill="#f2e2d4">Refine</text>
</g>
<g aria-label="Stage 5: Turn saved research into a draft for critical review.">
<title>Optional paper — Turn saved research into a draft for critical review.</title>
<rect x="358" y="312" width="248" height="106" rx="11" fill="#b76a2e" opacity=".26" filter="url(#cardShadow)"/>
<rect x="358" y="312" width="248" height="106" rx="11" fill="url(#cardFill)" stroke="url(#copperStroke)" stroke-width="2.25"/>
<rect x="363" y="317" width="238" height="96" rx="7" fill="none" stroke="#f2c590" stroke-width=".7" opacity=".28"/>
<path d="M371 319 H594" stroke="url(#metalShine)" stroke-width="2"/>
<rect x="370" y="334" width="2" height="61" rx="1" fill="#ecad6e" opacity=".74"/>
<text x="386" y="343" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="700" letter-spacing="2.1" fill="#dba879">05</text>
<text x="386" y="387" font-family="Georgia,'Times New Roman',serif" font-size="26" fill="#f2e2d4">Optional paper</text>
</g>
<g aria-label="Stage 6: Inspect and share results, evidence, and limitations.">
<title>Review/export — Inspect and share results, evidence, and limitations.</title>
<rect x="60" y="312" width="248" height="106" rx="11" fill="#b76a2e" opacity=".26" filter="url(#cardShadow)"/>
<rect x="60" y="312" width="248" height="106" rx="11" fill="url(#cardFill)" stroke="url(#copperStroke)" stroke-width="2.25"/>
<rect x="65" y="317" width="238" height="96" rx="7" fill="none" stroke="#f2c590" stroke-width=".7" opacity=".28"/>
<path d="M73 319 H296" stroke="url(#metalShine)" stroke-width="2"/>
<rect x="72" y="334" width="2" height="61" rx="1" fill="#ecad6e" opacity=".74"/>
<text x="88" y="343" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="700" letter-spacing="2.1" fill="#dba879">06</text>
<text x="88" y="387" font-family="Georgia,'Times New Roman',serif" font-size="26" fill="#f2e2d4">Review/export</text>
</g>
<path d="M60 448H964" stroke="#9b623e" stroke-width=".75" opacity=".32"/>
<g fill="#a47c61" font-family="Arial,Helvetica,sans-serif" font-size="10.5" letter-spacing="2.2"><text x="61" y="463">INVESTIGATE</text><text x="962" y="463" text-anchor="end">INSPECT  •  CONTINUE  •  SHARE</text></g>
</svg>
