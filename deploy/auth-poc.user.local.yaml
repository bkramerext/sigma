# Explicit opt-in Mac/Linux local POC only. Same credential worker and browser
# images as GCE; only filesystem UID and bind-mount ownership differ.
# This file is appended AFTER the private GCE per-user overlay by host_broker.
services:
  auth-poc:
    user: "${SIGMA_AUTH_POC_LOCAL_UID:?local POC UID required}:${SIGMA_AUTH_POC_LOCAL_GID:?local POC GID required}"
    tmpfs:
      - /tmp:rw,nosuid,size=64m,uid=${SIGMA_AUTH_POC_LOCAL_UID},gid=${SIGMA_AUTH_POC_LOCAL_GID},mode=0700
    volumes:
      - type: bind
        source: ${SIGMA_STATE_DISK_MOUNT:?local per-user state required}/auth/auth-poc
        target: /var/lib/sigma-poc-auth
  # The browser is still a different UID and has no credential mount.
