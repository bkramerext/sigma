# Per-user containers remain on their own Compose-private Docker bridge.
# NO shared sigma_application attachment and NO published browser ports.
# The backend reaches the browser exclusively through its per-user Unix socket.
services:
  auth-poc:
    ports: !override []
    volumes:
      - type: bind
        source: ${SIGMA_AUTH_POC_GATEWAY_DIR:?private per-user IPC directory required}
        target: /run/sigma-personal
  browser:
    network_mode: "service:auth-poc"
