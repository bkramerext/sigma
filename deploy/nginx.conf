server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Every normal navigation and refresh must revalidate the SPA document.
    # This also covers deep links served via the index.html fallback.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }

    # Vite emits content-hashed build outputs under /assets/. Cache only
    # those immutable URLs across releases; missing assets must return 404,
    # never the SPA HTML fallback (which would mask an old/new build mismatch).
    location ^~ /assets/ {
        try_files $uri =404;
        # Do not cache a missing fingerprint (404) for a year during rollout.
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }
}
