name: sigma

services:
  backend:
    platform: linux/amd64
    image: sigma-backend:${SIGMA_RELEASE:?set SIGMA_RELEASE}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    user: "${SIGMA_BACKEND_UID:-10001}:${SIGMA_BACKEND_GID:-10001}"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 5g
    cpus: 2.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,uid=${SIGMA_BACKEND_UID:-10001},gid=${SIGMA_BACKEND_GID:-10001},mode=0700
    volumes:
      - sigma-state:/var/lib/sigma-auth
      - type: bind
        source: ${SIGMA_SANDBOX_DOCKER_SOCKET:?set rootless sandbox daemon socket}
        target: /run/sigma-sandbox/docker.sock
        read_only: true
    group_add:
      - ${SIGMA_SANDBOX_DOCKER_GID:?set rootless sandbox daemon group id}
    secrets:
      - google_oidc_client_secret
      - cloud_openai_api_key
      - invitation_smtp_password
    environment:
      SIGMA_CLOUD_AUTH_ENABLED: "true"
      SIGMA_CLOUD_AUTH_HOME: /var/lib/sigma-auth
      SIGMA_CLOUD_CHATGPT_AUTH_HOME: /var/lib/sigma-auth/chatgpt-sponsor
      SIGMA_CLOUD_INFERENCE_PROVIDER: ${SIGMA_CLOUD_INFERENCE_PROVIDER:-api_key}
      SIGMA_CLOUD_SPONSOR_EMAIL: ${SIGMA_CLOUD_SPONSOR_EMAIL:-}
      SIGMA_CLOUD_WORKSPACES_ROOT: /var/lib/sigma-auth/workspaces
      SIGMA_CLOUD_DEMO_AUDIT: /opt/sigma/demo/handshake-demo-audit.json
      SIGMA_CLOUD_PUBLIC_ORIGIN: https://${SIGMA_DOMAIN:?set SIGMA_DOMAIN}
      SIGMA_CLOUD_ADMIN_CONTACT_EMAIL: ${SIGMA_CLOUD_ADMIN_CONTACT_EMAIL:?set public administrator contact email}
      GOOGLE_OIDC_CLIENT_ID: ${GOOGLE_OIDC_CLIENT_ID:?set production OAuth client id}
      GOOGLE_OIDC_CLIENT_SECRET_FILE: /run/secrets/google_oidc_client_secret
      SIGMA_CLOUD_OPENAI_API_KEY_FILE: /run/secrets/cloud_openai_api_key
      SIGMA_CLOUD_SPONSORED_ENABLED: ${SIGMA_CLOUD_SPONSORED_ENABLED:-false}
      SIGMA_CLOUD_FORCE_SPONSORED_MODE: ${SIGMA_CLOUD_FORCE_SPONSORED_MODE:-false}
      SIGMA_INVITATION_SMTP_USERNAME: ${SIGMA_INVITATION_SMTP_USERNAME:?set authenticated notification sender account}
      SIGMA_INVITATION_SMTP_PASSWORD_FILE: /run/secrets/invitation_smtp_password
      SIGMA_CLOUD_USER_SPEND_CEILING_USD: ${SIGMA_CLOUD_USER_SPEND_CEILING_USD:-2.00}
      SIGMA_CLOUD_GLOBAL_SPEND_CEILING_USD: ${SIGMA_CLOUD_GLOBAL_SPEND_CEILING_USD:-15.00}
      SIGMA_CLOUD_GLOBAL_SPEND_WINDOW: ${SIGMA_CLOUD_GLOBAL_SPEND_WINDOW:-cumulative}
      SIGMA_CLOUD_USER_MAX_CONCURRENT: ${SIGMA_CLOUD_USER_MAX_CONCURRENT:-2}
      SIGMA_CLOUD_GLOBAL_MAX_CONCURRENT: ${SIGMA_CLOUD_GLOBAL_MAX_CONCURRENT:-4}
      SIGMA_CLOUD_USER_MAX_QUEUED: ${SIGMA_CLOUD_USER_MAX_QUEUED:-4}
      SIGMA_CLOUD_GLOBAL_MAX_QUEUED: ${SIGMA_CLOUD_GLOBAL_MAX_QUEUED:-16}
      SIGMA_CLOUD_USER_TOKEN_BUDGET: ${SIGMA_CLOUD_USER_TOKEN_BUDGET:-2000000}
      SIGMA_RESEARCH_DOCKER_HOST: unix:///run/sigma-sandbox/docker.sock
      DOCKER_CONFIG: /tmp/docker
    networks: [application]
    healthcheck:
      test:
        - CMD
        - python
        - -m
        - sigma.deployment_health
      interval: 30s
      timeout: 25s
      start_period: 30s
      retries: 3
    logging:
      driver: local
      options: {max-size: "20m", max-file: "5"}

  frontend:
    platform: linux/amd64
    image: sigma-frontend:${SIGMA_RELEASE:?set SIGMA_RELEASE}
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    restart: unless-stopped
    read_only: true
    user: "101:101"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=16m,uid=101,gid=101,mode=0700
      - /var/run:rw,noexec,nosuid,size=1m,uid=101,gid=101,mode=0700
      - /tmp:rw,noexec,nosuid,size=8m,uid=101,gid=101,mode=0700
    networks: [application]
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    logging:
      driver: local
      options: {max-size: "20m", max-file: "5"}

  edge:
    platform: linux/amd64
    image: caddy:2.9.1-alpine@sha256:cf1bd22f2415bc99b785ece1df2c49d32985ac4ac42d84df335be17350593693
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
    environment:
      SIGMA_DOMAIN: ${SIGMA_DOMAIN:?set SIGMA_DOMAIN}
      SIGMA_TLS_EMAIL: ${SIGMA_TLS_EMAIL:?set TLS contact email}
      SIGMA_CADDY_SCHEME: ${SIGMA_CADDY_SCHEME:-https}
      SIGMA_CADDY_UPSTREAM_SCHEME: ${SIGMA_CADDY_UPSTREAM_SCHEME:-${SIGMA_CADDY_SCHEME:-https}}
    ports:
      - "${SIGMA_HTTP_BIND:-0.0.0.0}:${SIGMA_HTTP_PORT:-80}:80/tcp"
      - "${SIGMA_HTTPS_BIND:-0.0.0.0}:${SIGMA_HTTPS_PORT:-443}:443/tcp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [application]
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:2019/config/ || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    depends_on:
      backend: {condition: service_healthy}
      frontend: {condition: service_healthy}
    logging:
      driver: local
      options: {max-size: "20m", max-file: "5"}

secrets:
  google_oidc_client_secret:
    file: ${SIGMA_GOOGLE_OIDC_CLIENT_SECRET_FILE:?point to Google OAuth client secret file}
  cloud_openai_api_key:
    file: ${SIGMA_CLOUD_OPENAI_API_KEY_FILE:?point to sponsored OpenAI API key file}
  invitation_smtp_password:
    file: ${SIGMA_INVITATION_SMTP_PASSWORD_FILE:?point to authenticated notification SMTP password file}

volumes:
  sigma-state:
  caddy-data:
  caddy-config:

networks:
  application:
    internal: false
